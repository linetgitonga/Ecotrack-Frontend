name: ecotrack
description: "EcoTrack mobile app — CI/CD & architecture shell."
publish_to: "none"

# versionName+versionCode. Bump the build number in CI (--build-number).
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Per-flavor runtime config loaded from bundled .env.* assets.
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # One per flavor. On a fresh clone: cp .env.example .env.dev (etc).
    # In CI these are written from GitHub Secrets before the build.
    - .env.dev
    - .env.staging
    - .env.prod
