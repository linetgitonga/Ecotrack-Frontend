name: ecotrack
description: "EcoTrack — offline-first energy management for the Kenyan market."
publish_to: "none"

# versionName+versionCode. Bump the build number in CI (--build-number).
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0

  # DI
  get_it: ^8.3.0
  injectable: ^2.7.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6

  # Connectivity / discovery / background
  multicast_dns: ^0.3.3
  workmanager: ^0.9.0+3

  # Local persistence
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  connectivity_plus: ^6.1.5

  # Models / values
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0

  # Per-flavor runtime config from bundled .env.* assets
  flutter_dotenv: ^5.1.0

  # Charts
  fl_chart: ^1.0.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.15.1
  injectable_generator: ^2.12.1
  drift_dev: ^2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # Test tooling
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    # One per flavor. On a fresh clone: cp .env.example .env.dev (etc), or `make env`.
    # In CI these are written from GitHub Secrets before the build.
    - .env.dev
    - .env.staging
    - .env.prod
